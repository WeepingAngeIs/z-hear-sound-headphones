plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.mobsear'
version = '0.3.10'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def speechResources = layout.buildDirectory.dir('generated/offline-speech')
def wordModel = tasks.register('prepareOfflineWordModel', Exec) {
    inputs.file('ci/prepare_word_model.py')
    outputs.file(speechResources.map { it.file('dev/mobsear/client/words-win-x64.zip') })
    commandLine(System.getProperty('os.name').startsWith('Windows') ? 'python' : 'python3',
            'ci/prepare_word_model.py', speechResources.get().asFile)
}
sourceSets.main.resources.srcDir(speechResources)
tasks.named('processResources') { dependsOn wordModel }

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = uri('https://api.modrinth.com/maven') } }
        filter { includeModule('maven.modrinth', 'cobblemon') }
    }
}

dependencies {
    // Optional API only. Standalone clients and dedicated servers do not load Cobblemon classes.
    compileOnly('maven.modrinth:cobblemon:xsVHrAsY') { transitive = false }
    // Cobblemon's Java-callable registry listener also has Kotlin function overloads.
    compileOnly('org.jetbrains.kotlin:kotlin-stdlib:2.4.0') { transitive = false }
}

if (providers.gradleProperty('voiceGameTests').isPresent()) {
    sourceSets.main.java.srcDir('ci/gametest')
    sourceSets.main.resources.srcDir('ci/gametest-resources')
}

neoForge {
    version = providers.gradleProperty('neoForgeVersion').getOrElse('21.1.249')
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'mobsear'
        }
    }
    mods {
        mobsear { sourceSet(sourceSets.main) }
    }
}

if (providers.gradleProperty('voiceMultiplayer').isPresent()) {
    apply from: 'ci/multiplayer/runs.gradle'
}
if (providers.gradleProperty('cobblemonFixture').isPresent()) {
    apply from: 'ci/cobblemon/runs.gradle'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// These fixtures run as ordinary Java programs with synthetic devices and no test framework.
tasks.named('test') { failOnNoDiscoveredTests = false }
[
    audioFixture: 'dev.mobsear.client.VoiceAudioFixture',
    preferencesFixture: 'dev.mobsear.client.VoicePreferencesFixture',
    segmentationFixture: 'dev.mobsear.client.SpeechCuesFixture',
    talkWindowFixture: 'dev.mobsear.server.TalkWindowFixture'
].each { taskName, fixture ->
    def verification = tasks.register(taskName, JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = fixture
    }
    tasks.named('check') { dependsOn verification }
}
