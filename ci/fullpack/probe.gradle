allprojects {
    plugins.withId('java') {
        def probe = sourceSets.create('acousticPackProbe') {
            java.srcDirs = [rootProject.file('ci/fullpack/java'), rootProject.file('ci/shared-pokemon/java')]
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        }
        tasks.register('acousticPackProbeJar', Jar) {
            from probe.output
            from(rootProject.file('ci/fullpack/neoforge.mods.toml')) { into 'META-INF' }
            archiveFileName = 'ci-acoustic-observer.jar'
            destinationDirectory = rootProject.layout.buildDirectory.dir('pack-probe')
        }
        def joinProbe = sourceSets.create('micJoinProbe') {
            java.srcDirs = [rootProject.file('ci/join/java')]
            compileClasspath += sourceSets.main.compileClasspath
        }
        tasks.register('micJoinProbeJar', Jar) {
            from joinProbe.output
            from(rootProject.file('ci/join/neoforge.mods.toml')) { into 'META-INF' }
            archiveFileName = 'ci-mic-join-observer.jar'
            destinationDirectory = rootProject.layout.buildDirectory.dir('pack-probe')
        }
        tasks.register('configtopiaPublicClasspath') {
            dependsOn('createMinecraftArtifacts')
            doLast {
                def path = rootProject.layout.buildDirectory.file('public-configtopia-classpath.txt').get().asFile
                path.text = sourceSets.main.compileClasspath.asPath
            }
        }
    }
}
