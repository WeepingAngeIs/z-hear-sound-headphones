name: Public-pack Survival speech test
on:
  workflow_call:
    inputs:
      candidate_run:
        type: string
        required: true
      candidate_sha256:
        type: string
        required: true
      candidate_artifact:
        type: string
        required: true
      with_control:
        type: boolean
        default: false
  push:
    branches: [codex/proximity-voice-prototype, codex/berry-visit-source, codex/no-mob-call-cooldowns]
    paths: ['ci/fullpack/**', '.github/workflows/fullpack.yml']
  workflow_dispatch:
    inputs:
      candidate_run:
        type: string
        description: Optional canonical production build run to test in place of installed 0.3.1
      candidate_sha256:
        type: string
        description: Exact JAR digest from that production build
      candidate_artifact:
        type: choice
        options: [mobs-hear-u, voice-archive-verification]
        default: mobs-hear-u
        description: Artifact already attached to the verified build
      with_control:
        type: boolean
        description: Also rerun the smaller Cobblemon comparison
        default: false
permissions:
  contents: read
  actions: read
jobs:
  speech:
    name: Generate the shared recordings once
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.cases.outputs.profiles }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Select the requested comparisons
        id: cases
        shell: python
        env:
          PORTABLE_VERIFY: ${{ inputs.candidate_artifact == 'voice-archive-verification' }}
          SMALL_CONTROL: ${{ inputs.with_control }}
        run: |
          import json, os
          from pathlib import Path
          profiles=['public-pack']
          pin=Path('ci/fullpack/candidate.json')
          if os.environ.get('PORTABLE_VERIFY')=='true':
              if os.environ.get('SMALL_CONTROL')=='true': profiles.append('focused-control')
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as output:
                  print('profiles='+json.dumps(profiles),file=output)
              raise SystemExit(0)
          if pin.exists() and json.loads(pin.read_text())['compareReferences']:
              profiles.extend(['earlier-public-pack','installed-public-pack'])
          if pin.exists() and json.loads(pin.read_text()).get('priorityControl'):
              profiles.append('public-pack-helper-priority')
          if pin.exists() and json.loads(pin.read_text()).get('graphicsControl'):
              profiles.append('public-pack-software-renderer')
          if os.environ['GITHUB_REF_NAME']!='codex/berry-visit-source' and (os.environ['SMALL_CONTROL']=='true' or (pin.exists() and json.loads(pin.read_text()).get('compareFocused'))):
              profiles.append('focused-control')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as out:
              print('profiles='+json.dumps(profiles),file=out)
      - shell: powershell
        run: ./ci/fullpack/shared-speech.ps1 "${{ runner.temp }}/comparison-pcm"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-comparison-input
          path: ${{ runner.temp }}/comparison-pcm/*.pcm
          if-no-files-found: error
  acoustic:
    name: ${{ matrix.profile }} / Survival generated speech
    needs: speech
    runs-on: windows-2022
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.speech.outputs.profiles) }}
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: '2'
      MOBSEAR_NATIVE_WORLD: '1'
      MOBSEAR_PROFILE: ${{ matrix.profile }}
      MOBSEAR_CANDIDATE_RUN: ${{ inputs.candidate_run }}
      MOBSEAR_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      MOBSEAR_EARLIER: ${{ matrix.profile == 'earlier-public-pack' && '1' || '0' }}
      MOBSEAR_INSTALLED_REFERENCE: ${{ matrix.profile == 'installed-public-pack' && '1' || '0' }}
      MOBSEAR_PRIORITY_CONTROL: ${{ matrix.profile == 'public-pack-helper-priority' && '1' || '0' }}
      MOBSEAR_LIGHT_GRAPHICS: ${{ matrix.profile == 'public-pack-software-renderer' && '1' || '0' }}
      PORTABLE_VERIFY: ${{ inputs.candidate_artifact == 'voice-archive-verification' }}
      MOBSEAR_CONFIDENCE_COMPARE: ${{ (matrix.profile == 'public-pack' || matrix.profile == 'public-pack-helper-priority') && '1' || '0' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
      - name: Install the production launcher library
        run: python -m pip install --disable-pip-version-check minecraft-launcher-lib==8.0 requests==2.32.5
      - name: Build the separate test observer
        run: ./gradlew.bat --no-daemon --max-workers=2 --console=plain -I ci/fullpack/probe.gradle acousticPackProbeJar ${{ env.PORTABLE_VERIFY == 'true' && '-x prepareSpeechData' || '' }}
      - name: Resolve the published Configtopia compiler dependencies
        if: matrix.profile != 'focused-control'
        run: ./gradlew.bat --no-daemon --max-workers=2 --console=plain '-PneoForgeVersion=21.1.255' -I ci/fullpack/probe.gradle configtopiaPublicClasspath
      - name: Generate synthetic Windows speech and prepare hosted graphics
        shell: powershell
        run: ./ci/windows-world/prepare.ps1
      - name: Use identical audio samples in every comparison
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: generated-comparison-input
          path: ${{ runner.temp }}/hearing-windows/synth
      - name: Restore public inputs by checksum
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        run: python ci/fullpack/stage.py "${{ runner.temp }}/hearing-windows/game" ${{ matrix.profile == 'focused-control' && '--focused' || '' }}
      - name: Save the checksum comparison only
        if: matrix.profile == 'public-pack'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-pack-checksums
          path: ${{ runner.temp }}/public-pack-checksums.json
      - name: Select the exact production file for the comparison
        id: subject
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          build = os.environ.get('MOBSEAR_CANDIDATE_RUN','')
          digest = os.environ.get('MOBSEAR_CANDIDATE_SHA256','')
          pin = Path('ci/fullpack/candidate.json')
          feedback = False
          visit = False
          sentences = False
          nearby = False
          distractions = False
          berries = False
          base_calls = False
          wordplay = False
          if os.environ.get('PORTABLE_VERIFY')=='true':
              # These shared capture checks include the repeat visits and the optional local feedback case.
              feedback = visit = sentences = nearby = True
              berries = base_calls = wordplay = distractions = True
          elif os.environ['GITHUB_EVENT_NAME']=='push' and pin.is_file():
              item = json.loads(pin.read_text(encoding='utf8'))
              build, digest = str(item['run']), item['sha256']
              feedback = item.get('testFeedback',False)
              visit = item.get('testVisit',False)
              sentences = item.get('testSentences',False)
              nearby = item.get('testNearby',False)
              distractions = item.get('testDistractions',False)
              berries = item.get('testVisitBerries',False)
              base_calls = item.get('testBaseCalls',False)
              wordplay = item.get('testWordplay',False)
          if os.environ['MOBSEAR_EARLIER']=='1' or os.environ['MOBSEAR_INSTALLED_REFERENCE']=='1':
              build, digest = '', ''
          if build or digest:
              assert build.isdigit() and re.fullmatch(r'[0-9a-f]{64}',digest)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as f:
              print('MOBSEAR_CANDIDATE_RUN='+build,'MOBSEAR_CANDIDATE_SHA256='+digest,'MOBSEAR_TRACK_STARTUP='+('1' if build else '0'),'MOBSEAR_EXTRA_NAMES='+('1' if build else '0'),sep='\n',file=f)
              print('MOBSEAR_TEST_FEEDBACK='+('1' if build and feedback else '0'),file=f)
              print('MOBSEAR_TEST_VISIT='+('1' if build and visit else '0'),file=f)
              print('MOBSEAR_TEST_VISIT_BERRIES='+('1' if build and berries else '0'),file=f)
              print('MOBSEAR_TEST_BASE_CALLS='+('1' if build and base_calls else '0'),file=f)
              print('MOBSEAR_TEST_WORDPLAY='+('1' if build and wordplay else '0'),file=f)
              print('MOBSEAR_TEST_SENTENCES='+('1' if build and sentences else '0'),file=f)
              print('MOBSEAR_TEST_NEARBY='+('1' if build and nearby else '0'),file=f)
              if build and distractions:
                  group_profile = 'focused' if os.environ['MOBSEAR_PROFILE']=='focused-control' else 'full'
                  print('MOBSEAR_TEST_DISTRACTIONS='+group_profile,file=f)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as f:
              print('build='+build,file=f)
      - name: Retrieve the exact packaged candidate from its production build
        if: steps.subject.outputs.build != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.candidate_artifact || 'mobs-hear-u' }}
          run-id: ${{ steps.subject.outputs.build }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/hearing-windows/candidate
      - name: Start a new single-player world with the installed pack's registries
        run: python ci/fullpack/watch.py start
      - name: Observe the native client and integrated server starting
        run: python ci/fullpack/watch.py 480
      - name: Save startup progress without game logs or save data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: startup-${{ matrix.profile }}
          path: ${{ runner.temp }}/hearing-windows/boot-progress.txt
      - name: Observe voice availability after joining the world
        run: python ci/fullpack/watch.py 780
      - name: Save the joined world's test stages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-progress-${{ matrix.profile }}
          path: ${{ runner.temp }}/hearing-windows/boot-progress.txt
      - name: Play generated speech in disposable Survival and Creative
        run: python ci/fullpack/watch.py finish
      - name: Replay the known generated relative call if the live run failed
        if: failure() && !cancelled() && env.PORTABLE_VERIFY != 'true' && env.MOBSEAR_TEST_NEARBY == '1'
        run: python ci/fullpack/replay_relative.py
      - name: Measure first-pass and retry confidence on the shared synthetic clips
        if: ${{ !cancelled() && env.PORTABLE_VERIFY != 'true' && env.MOBSEAR_CONFIDENCE_COMPARE == '1' && steps.subject.outputs.build != '' }}
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          sys.path.insert(0,'ci/fullpack')
          from confidence import compare
          root = Path(os.environ['MOBSEAR_SMOKE_DIR'])
          if (root/'public-registry.bin').is_file():
              compare(root)
      - name: Save the public registry vocabulary for the offline comparison
        if: ${{ !cancelled() && matrix.profile == 'public-pack' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-registry-vocabulary
          path: ${{ runner.temp }}/hearing-windows/public-registry.bin
          retention-days: 7
          if-no-files-found: ignore
      - name: Save generated-game views only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heard-in-${{ matrix.profile }}
          path: ${{ runner.temp }}/hearing-windows/evidence/*.png
          if-no-files-found: ignore
