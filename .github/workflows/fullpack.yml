name: Installed 0.3.1 public-pack speech test
on:
  push:
    branches: [codex/proximity-voice-prototype]
    paths: ['ci/fullpack/**', '.github/workflows/fullpack.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    name: Verify public pack downloads against TEST
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Download published JARs, overrides and add-on packs by checksum
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        run: python ci/fullpack/stage.py "${{ runner.temp }}/pack-check/game"
