name: Cobblemon species in real worlds
on:
  push:
    branches: [codex/proximity-voice-prototype, codex/berry-visit-source, codex/berry-chew-pro-build, codex/no-mob-call-cooldowns, main]
    paths-ignore: ['ci/fullpack/**', '.github/workflows/fullpack.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  species:
    name: Cobblemon 1.8.4 / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    env:
      MOBSEAR_POKEMON_PACK: '1'
      MOBSEAR_ENTITY_PACK: '1'
    timeout-minutes: 44
    strategy:
      fail-fast: false
      matrix:
        mode: [solo, multi]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Send species calls through Minecraft and verify nearby Pokémon
        run: python3 ci/cobblemon/run.py ${{ matrix.mode }}
      - name: Keep rendered Pokémon and actual game-output evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pokemon-${{ matrix.mode }}-views
          path: |
            build/pokemon-evidence/*.png
            build/pokemon-evidence/*.wav
            build/pokemon-evidence/*.tsv
          if-no-files-found: error
      - name: Keep independently resolved species catalogs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pokemon-${{ matrix.mode }}-catalogs
          path: build/pokemon-catalogs/*.tsv
          if-no-files-found: warn
