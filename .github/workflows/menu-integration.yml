name: Menu integration
on:
  push:
    branches: [codex/proximity-voice-prototype, codex/gui-scale, codex/hud-appearance, codex/portable-speech, main]
    paths: ['ci/**', 'src/main/java/dev/mobsear/client/**', 'src/main/resources/**', 'ci/multiplayer/**', '.github/workflows/menu-integration.yml', 'build.gradle']
  workflow_dispatch:
    inputs:
      join_run:
        description: Optional existing audited build run to exercise multiplayer joins only
        type: string
      join_sha:
        description: Raw SHA-256 of that existing JAR
        type: string
      legacy_probe:
        description: Check the legacy Windows runtime separately on an existing scanned archive
        type: boolean
        default: false
      command_probe:
        description: Inspect fixed generated desktop-command contrasts from this existing build instead of joining
        type: boolean
        default: false
      join_fixture:
        description: Dedicated-server pack to verify when reusing a build
        type: choice
        options: [both, cobblemon-control, public-pack]
        default: both
permissions:
  contents: read
  actions: read
jobs:
  public-client:
    if: inputs.join_run == ''
    name: FancyMenu and Sodium/Iris backdrop checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: github.ref_name == 'codex/portable-speech'
        with:
          python-version: '3.12'
      - name: Build the production JAR on NeoForge 21.1.249
        if: github.ref_name == 'codex/gui-scale' || github.ref_name == 'codex/hud-appearance'
        run: |
          bash gradlew --no-daemon build
          mkdir -p dist
          cp build/libs/mobsear-*.jar 'dist/Mic Voice Chat - Mobs & Cobblemon Hear You.jar'
          sha256sum dist/*.jar
      - name: Open each original and animated menu in a modded client
        env:
          MOBSEAR_PUBLIC_MENU_STACK: ${{ (github.ref_name == 'codex/hud-appearance' || github.ref_name == 'codex/portable-speech') && '0' || '1' }}
          MOBSEAR_HUD_ONLY: ${{ (github.ref_name == 'codex/hud-appearance' || github.ref_name == 'codex/portable-speech') && '1' || '0' }}
          MOBSEAR_GUI_ONLY: ${{ github.ref_name == 'codex/gui-scale' && '1' || '0' }}
        run: xvfb-run -a -s '-screen 0 1440x900x24' bash ci/multiplayer/run.sh
      - name: Keep the verified GUI build
        if: success() && (github.ref_name == 'codex/gui-scale' || github.ref_name == 'codex/hud-appearance')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-voice-gui
          path: dist/*.jar
          if-no-files-found: error
      - name: Keep actual modded-client screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: menu-integration-previews
          path: build/state-previews/menu-*.png
          if-no-files-found: error

  portable-package:
    name: Build, audit and test the packaged mod
    outputs:
      raw_sha: ${{ steps.package.outputs.raw_sha }}
    if: github.ref_name == 'codex/portable-speech' && inputs.join_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: voice-archive-verification
          run-id: '45500399343'
          github-token: ${{ github.token }}
          path: prior
      - name: Build the actual installable archive and inspect all nested content
        id: package
        run: |
          bash gradlew --no-daemon build
          mkdir -p dist
          cp build/libs/mobsear-0.3.15.jar 'dist/Mic Voice Chat - Mobs & Cobblemon Hear You.jar'
          python3 ci/audit_archive.py dist/*.jar --version 0.3.15 --report dist/archive-audit.json
          build/speech-graph-tools/bin/python ci/compare_portable.py prior/*.jar dist/*.jar
          (cd dist && sha256sum *.jar > SHA256SUMS.txt)
          echo "raw_sha=$(cut -d ' ' -f1 dist/SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"
      - name: Attach candidate for independent downstream verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-archive-verification
          path: dist/
          if-no-files-found: error
      - name: Exercise server mob behavior on NeoForge 21.1.249
        run: |
          set -o pipefail
          bash gradlew --no-daemon -PvoiceGameTests runGameTestServer 2>&1 | tee "$RUNNER_TEMP/games.log"
          grep -Ei 'all [1-9][0-9]* required tests passed' "$RUNNER_TEMP/games.log"
  portable-windows:
    name: Windows speech from exact scanned JAR
    if: github.ref_name == 'codex/portable-speech'
    needs: portable-package
    runs-on: windows-2022
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: voice-archive-verification
          path: dist
      - name: Verify SHA, prepare the exact Windows libraries and generated PCM
        shell: powershell
        run: |
          $expected=(Get-Content dist/SHA256SUMS.txt).Split(' ')[0]
          if ((Get-FileHash (Get-ChildItem 'dist/*.jar').FullName).Hash -ne $expected) { throw 'Unexpected JAR hash' }
          ./ci/portable_speech_checks.ps1 prepare
      - name: Standalone mob, entity and species calls plus negative controls
        shell: powershell
        run: ./ci/portable_speech_checks.ps1 commands
      - name: Local diagnostic opt-out, bounded recovery and silence
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./ci/portable_speech_checks.ps1 lifecycle
      - name: Whole names in natural speech
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./ci/portable_speech_checks.ps1 sentences
      - name: Nearby species, pronunciation variants and ordinary speech
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./ci/portable_speech_checks.ps1 nearby
      - name: Exercise both models on the legacy Windows inference runtime
        uses: ./.github/actions/legacy-model
        with:
          token: ${{ github.token }}
  portable-game:
    name: Packaged Windows client and integrated server
    needs: portable-package
    if: github.ref_name == 'codex/portable-speech'
    uses: ./.github/workflows/fullpack.yml
    with:
      candidate_run: ${{ format('{0}', github.run_id) }}
      candidate_sha256: ${{ needs.portable-package.outputs.raw_sha }}
      candidate_artifact: voice-archive-verification
      with_control: true

  portable-join:
    name: Multiplayer join and normal play / ${{ matrix.pack }}
    needs: portable-package
    if: always() && !cancelled() && !inputs.command_probe && !inputs.legacy_probe && github.ref_name == 'codex/portable-speech' && (needs.portable-package.result == 'success' || (inputs.join_run != '' && inputs.join_sha != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJSON(inputs.join_fixture == 'public-pack' && '["public-pack"]' || inputs.join_fixture == 'cobblemon-control' && '["cobblemon-control"]' || '["cobblemon-control","public-pack"]') }}
    env:
      PYTHONUNBUFFERED: '1'
      JOIN_PACK: ${{ matrix.pack }}
      RAW_SHA: ${{ inputs.join_sha || needs.portable-package.outputs.raw_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.9'
          cache: gradle
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.8'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: voice-archive-verification
          run-id: ${{ inputs.join_run || github.run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Prepare the independent gameplay observer
        run: |
          python -m pip install minecraft-launcher-lib==8.0 requests==2.32.5
          bash gradlew --no-daemon --max-workers=2 -I ci/fullpack/probe.gradle micJoinProbeJar
      - name: Resolve public pack construction inputs
        if: matrix.pack == 'public-pack'
        run: bash gradlew --no-daemon --max-workers=2 -PneoForgeVersion=21.1.255 -I ci/fullpack/probe.gradle configtopiaPublicClasspath
      - name: Reconstruct client mod inventories from public checksums
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        run: python ci/fullpack/stage.py "$RUNNER_TEMP/join-client" ${{ matrix.pack == 'cobblemon-control' && '--focused' || '' }}
      - name: Join the same production dedicated server with two real clients in turn
        run: xvfb-run -a -s '-screen 0 960x600x24' python ci/join/play.py

  generated-command-contrast:
    name: Generated Pikachu and confusable desktop commands
    if: inputs.command_probe && inputs.join_run != '' && github.ref_name == 'codex/portable-speech'
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: voice-archive-verification
          run-id: ${{ inputs.join_run }}
          github-token: ${{ github.token }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: generated-comparison-input
          run-id: ${{ inputs.join_run }}
          github-token: ${{ github.token }}
          path: evidence/input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: published-registry-vocabulary
          run-id: ${{ inputs.join_run }}
          github-token: ${{ github.token }}
          path: evidence/registry
      - name: Compare independent readings from the actual desktop recognizer
        env:
          EXPECTED_JAR: ${{ inputs.join_sha }}
        shell: pwsh
        run: |
          $jar=(Get-ChildItem dist -Filter '*.jar').FullName
          if ((Get-FileHash $jar).Hash -ne $env:EXPECTED_JAR) {throw 'Unexpected raw JAR'}
          $hash = @{'jna'='67bf3eaea4f0718cb376a181a629e5f88fa1c9dd';'jna-platform'='28934d48aed814f11e4c584da55c49fa7032b31b'}
          foreach ($name in $hash.Keys) {
            $file="dist/$name-5.14.0.jar"
            Invoke-WebRequest "https://libraries.minecraft.net/net/java/dev/jna/$name/5.14.0/$name-5.14.0.jar" -OutFile $file
            if ((Get-FileHash -Algorithm SHA1 $file).Hash -ne $hash[$name]) {throw 'Unexpected launcher library'}
          }
          $cp=".;dist/*"
          javac --release 21 -cp $cp -d . ci/speech-focus/DesktopContrast.java
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          java -cp $cp dev.mobsear.client.speech.DesktopContrast

  archived-legacy:
    name: Legacy Windows inference from the same scanned JAR
    if: inputs.legacy_probe && inputs.join_run != '' && github.ref_name == 'codex/portable-speech'
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: voice-archive-verification
          run-id: ${{ inputs.join_run }}
          github-token: ${{ github.token }}
          path: dist
      - name: Check requested raw digest
        shell: pwsh
        env:
          EXPECTED: ${{ inputs.join_sha }}
        run: |
          if ((Get-FileHash 'dist/Mic Voice Chat - Mobs & Cobblemon Hear You.jar').Hash -ne $env:EXPECTED) {throw 'Unexpected raw JAR'}
      - uses: ./.github/actions/legacy-model
        with:
          token: ${{ github.token }}
