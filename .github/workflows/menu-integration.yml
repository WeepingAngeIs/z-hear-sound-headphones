name: Menu integration
on:
  push:
    branches: [codex/proximity-voice-prototype, codex/gui-scale, codex/hud-appearance, codex/portable-speech, main]
    paths: ['ci/**', 'src/main/java/dev/mobsear/client/**', 'src/main/resources/**', 'ci/multiplayer/**', '.github/workflows/menu-integration.yml', 'build.gradle']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  public-client:
    name: FancyMenu and Sodium/Iris backdrop checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: github.ref_name == 'codex/portable-speech'
        with:
          python-version: '3.12'
      - name: Build the production JAR on NeoForge 21.1.249
        if: github.ref_name == 'codex/gui-scale' || github.ref_name == 'codex/hud-appearance'
        run: |
          bash gradlew --no-daemon build
          mkdir -p dist
          cp build/libs/mobsear-*.jar 'dist/Mic Voice Chat - Mobs & Cobblemon Hear You.jar'
          sha256sum dist/*.jar
      - name: Open each original and animated menu in a modded client
        env:
          MOBSEAR_PUBLIC_MENU_STACK: ${{ (github.ref_name == 'codex/hud-appearance' || github.ref_name == 'codex/portable-speech') && '0' || '1' }}
          MOBSEAR_HUD_ONLY: ${{ (github.ref_name == 'codex/hud-appearance' || github.ref_name == 'codex/portable-speech') && '1' || '0' }}
          MOBSEAR_GUI_ONLY: ${{ github.ref_name == 'codex/gui-scale' && '1' || '0' }}
        run: xvfb-run -a -s '-screen 0 1440x900x24' bash ci/multiplayer/run.sh
      - name: Keep the verified GUI build
        if: success() && (github.ref_name == 'codex/gui-scale' || github.ref_name == 'codex/hud-appearance')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-voice-gui
          path: dist/*.jar
          if-no-files-found: error
      - name: Keep actual modded-client screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: menu-integration-previews
          path: build/state-previews/menu-*.png
          if-no-files-found: error

  portable-package:
    name: Build, audit and test the packaged mod
    outputs:
      raw_sha: ${{ steps.package.outputs.raw_sha }}
    if: github.ref_name == 'codex/portable-speech'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-voice-gui
          run-id: '45470236995'
          github-token: ${{ github.token }}
          path: prior
      - name: Build the actual installable archive and inspect all nested content
        id: package
        run: |
          bash gradlew --no-daemon build
          mkdir -p dist
          cp build/libs/mobsear-0.3.14.jar 'dist/Mic Voice Chat - Mobs & Cobblemon Hear You.jar'
          python3 ci/audit_archive.py dist/*.jar --version 0.3.14 --report dist/archive-audit.json
          build/speech-graph-tools/bin/python ci/compare_portable.py prior/*.jar dist/*.jar
          (cd dist && sha256sum *.jar > SHA256SUMS.txt)
          echo "raw_sha=$(cut -d ' ' -f1 dist/SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"
      - name: Attach candidate for independent downstream verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-archive-verification
          path: dist/
          if-no-files-found: error
      - name: Exercise server mob behavior on NeoForge 21.1.249
        run: |
          set -o pipefail
          bash gradlew --no-daemon -PvoiceGameTests runGameTestServer 2>&1 | tee "$RUNNER_TEMP/games.log"
          grep -Ei 'all [1-9][0-9]* required tests passed' "$RUNNER_TEMP/games.log"
  portable-windows:
    name: Windows speech from exact scanned JAR
    if: github.ref_name == 'codex/portable-speech'
    needs: portable-package
    runs-on: windows-2022
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: voice-archive-verification
          path: dist
      - name: Verify SHA, prepare the exact Windows libraries and generated PCM
        shell: powershell
        run: |
          $expected=(Get-Content dist/SHA256SUMS.txt).Split(' ')[0]
          if ((Get-FileHash (Get-ChildItem 'dist/*.jar').FullName).Hash -ne $expected) { throw 'Unexpected JAR hash' }
          ./ci/portable_speech_checks.ps1 prepare
      - name: Standalone mob, entity and species calls plus negative controls
        shell: powershell
        run: ./ci/portable_speech_checks.ps1 commands
      - name: Local diagnostic opt-out, bounded recovery and silence
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./ci/portable_speech_checks.ps1 lifecycle
      - name: Whole names in natural speech
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./ci/portable_speech_checks.ps1 sentences
      - name: Nearby species, pronunciation variants and ordinary speech
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./ci/portable_speech_checks.ps1 nearby
  portable-game:
    name: Packaged Windows client and integrated server
    needs: portable-package
    if: github.ref_name == 'codex/portable-speech'
    uses: ./.github/workflows/fullpack.yml
    with:
      candidate_run: ${{ format('{0}', github.run_id) }}
      candidate_sha256: ${{ needs.portable-package.outputs.raw_sha }}
      candidate_artifact: voice-archive-verification
