name: Menu integration
on:
  push:
    branches: [codex/proximity-voice-prototype, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-client:
    name: FancyMenu and Sodium/Iris backdrop checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Open each original and animated menu in a modded client
        env:
          MOBSEAR_PUBLIC_MENU_STACK: '1'
        run: xvfb-run -a -s '-screen 0 1440x900x24' bash ci/multiplayer/run.sh
      - name: Keep actual modded-client screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: menu-integration-previews
          path: build/state-previews/menu-*.png
          if-no-files-found: error
