name: Prototype checks
on:
  push:
    branches: [codex/proximity-voice-prototype, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    name: Build, synthetic audio and dedicated GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and check synthetic audio, segmentation and rate limits
        run: |
          bash gradlew --no-daemon build
          mkdir -p dist
          cp build/libs/mobsear-0.1.0-prototype.jar dist/
          jar tf dist/mobsear-0.1.0-prototype.jar | grep -qx 'dev/mobsear/client/recognize.ps1'
          if jar tf dist/mobsear-0.1.0-prototype.jar | grep -E 'GameTest|Fixture|hearing_floor'; then exit 1; fi
      - name: Exercise the server in a disposable world
        shell: bash
        run: |
          set -o pipefail
          bash gradlew --no-daemon -PvoiceGameTests runGameTestServer 2>&1 | tee "$RUNNER_TEMP/gametest.log"
          grep -Ei 'all [1-9][0-9]* required tests passed' "$RUNNER_TEMP/gametest.log"
      - name: Keep the verified prototype jar
        uses: actions/upload-artifact@v4
        with:
          name: mobsear-prototype
          path: dist/mobsear-0.1.0-prototype.jar
          if-no-files-found: error
  windows-speech:
    name: Offline Windows speech from synthetic PCM
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exercise the desktop recognizer in memory
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          [System.Speech.Recognition.SpeechRecognitionEngine]::InstalledRecognizers() | Select-Object Id,Culture
          New-Item -ItemType Directory ci-classes | Out-Null
          javac --release 21 -d ci-classes src/main/java/dev/mobsear/net/Cue.java src/main/java/dev/mobsear/client/SpeechCues.java src/test/java/dev/mobsear/client/SpeechCuesFixture.java
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -cp 'ci-classes;src/main/resources' dev.mobsear.client.SpeechCuesFixture --windows-speech
