name: Prototype checks
on:
  push:
    branches: [codex/proximity-voice-prototype, codex/berry-visit-source, main]
    paths-ignore: ['ci/windows-world/**', '.github/workflows/windows-world.yml', 'ci/fullpack/**', '.github/workflows/fullpack.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prototype-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  game:
    name: Build and dedicated GameTests on NeoForge 21.1.249
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and check synthetic audio, segmentation and rate limits
        run: |
          bash gradlew --no-daemon build
          mkdir -p dist
          cp build/libs/mobsear-0.3.11.jar dist/
          jar tf dist/mobsear-0.3.11.jar > "$RUNNER_TEMP/mod-contents.txt"
          grep -qx 'dev/mobsear/client/recognize.ps1' "$RUNNER_TEMP/mod-contents.txt"
          grep -qx 'dev/mobsear/client/words-win-x64.zip' "$RUNNER_TEMP/mod-contents.txt"
          if grep -E 'GameTest|Fixture|hearing_floor' "$RUNNER_TEMP/mod-contents.txt"; then exit 1; fi
      - name: Exercise the server in a disposable world
        shell: bash
        run: |
          set -o pipefail
          bash gradlew --no-daemon -PvoiceGameTests runGameTestServer 2>&1 | tee "$RUNNER_TEMP/gametest.log"
          grep -Ei 'all [1-9][0-9]* required tests passed' "$RUNNER_TEMP/gametest.log"
      - name: Keep the verified mod jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobs-hear-u
          path: dist/mobsear-0.3.11.jar
          if-no-files-found: error
  packaged-server:
    name: Packaged jar on NeoForge ${{ matrix.loader }}
    needs: game
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        loader: ['21.1.249', '21.1.255']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mobs-hear-u
          path: dist
      - name: Boot and stop the exact production jar in an isolated server
        run: python3 ci/packaged_server.py ${{ matrix.loader }} dist/*.jar
  windows-speech:
    name: Offline Windows speech from synthetic PCM
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare the pinned public English species vocabulary
        shell: powershell
        run: |
          python ci/prepare_word_model.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/cobblemon/stage.py build/speech-mods
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/cobblemon/speech_names.py build/speech-mods build/speech-species.tsv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/cobblemon/public_species.py --vocabulary build/speech-species.tsv
      - name: Exercise the desktop recognizer in memory
        shell: powershell
        env:
          MOBSEAR_SYNTH_PROOF_DIR: build/synthetic-speech
          MOBSEAR_SYNTHETIC_WORKER_FAULTS: '1'
          MOBSEAR_CUE_PROOF: recognized-calls.txt
          MOBSEAR_SPEECH_CATALOG: build/speech-species.tsv
          MOBSEAR_SPECIES_PROOF: recognized-species.txt
        run: |
          Add-Type -AssemblyName System.Speech
          [System.Speech.Recognition.SpeechRecognitionEngine]::InstalledRecognizers() | Select-Object Id,Culture
          New-Item -ItemType Directory ci-classes | Out-Null
          javac --release 21 --source-path src/main/java -d ci-classes src/test/java/dev/mobsear/client/SpeechCuesFixture.java
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -cp 'ci-classes;src/main/resources;build/generated/offline-speech' dev.mobsear.client.SpeechCuesFixture --windows-speech
      - name: Check late decisions and bounded worker recovery with a synthetic worker
        shell: powershell
        run: |
          $env:MOBSEAR_WORKER_FIXTURE=Join-Path $env:RUNNER_TEMP 'speech-timeout-fixture'
          New-Item -ItemType Directory -Path $env:MOBSEAR_WORKER_FIXTURE | Out-Null
          javac --release 21 -cp ci-classes -d ci-classes ci/speech-lifecycle/WorkerRecoveryFixture.java
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -cp 'ci/speech-lifecycle/resources;ci-classes;src/main/resources' dev.mobsear.client.WorkerRecoveryFixture
      - name: Keep the stock synthetic speech pitch demo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spoken-pitch-proof
          path: build/synthetic-speech/*.wav
          if-no-files-found: error
      - name: Pass only the synthetic cue decisions to the game clients
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recognized-calls
          path: |
            recognized-calls.txt
            recognized-distractions.txt
            recognized-species.txt
            build/speech-species.tsv
          if-no-files-found: error
  sentence-speech:
    name: Whole names in connected speech on Windows
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Feed generated sentences through capture, segmentation and the Windows recognizer
        shell: powershell
        env:
          MOBSEAR_SPEECH_CATALOG: build/speech-species.tsv
        run: |
          python ci/prepare_word_model.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/cobblemon/stage.py build/speech-mods
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/cobblemon/speech_names.py build/speech-mods build/speech-species.tsv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/cobblemon/public_species.py --vocabulary build/speech-species.tsv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $fixture = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'sentence-fixture')
          ./ci/speech-focus/make.ps1 $fixture.FullName
          python ci/speech-focus/corpus.py $fixture.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          javac --release 21 --source-path src/main/java -d ci-classes ci/speech-focus/FocusFixture.java ci/speech-focus/current/FixtureCapture.java
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -cp 'ci-classes;src/main/resources;build/generated/offline-speech' dev.mobsear.client.FocusFixture $fixture.FullName mentions
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./ci/speech-focus/nearby.ps1 $fixture.FullName
          $nearbyExit = $LASTEXITCODE
          python ci/speech-focus/mentions.py $fixture.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          exit $nearbyExit
  focused-speech:
    name: Spoken pronunciation and false-positive comparisons
    needs: windows-speech
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recognized-calls
          path: comparison-inputs
      - name: Fetch the verified 0.3.0 speech implementation for an identical-input comparison
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: c1e3a51d3c41f4e0d9a7c82cfc71ad5bb7c9fe10
          path: speech-baseline
          persist-credentials: false
      - name: Compare spoken Enderman and Lopunny on the same generated voices
        shell: powershell
        env:
          MOBSEAR_SPEECH_CATALOG: comparison-inputs/build/speech-species.tsv
        run: |
          python ci/prepare_word_model.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'focused-speech'
          New-Item -ItemType Directory -Path $fixtureRoot | Out-Null
          ./ci/speech-focus/make.ps1 $fixtureRoot
          python ci/speech-focus/corpus.py $fixtureRoot
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($variant in @('baseline','candidate')) {
            $sources = if ($variant -eq 'baseline') { 'speech-baseline/src/main' } else { 'src/main' }
            $classes = Join-Path $fixtureRoot $variant
            New-Item -ItemType Directory -Path $classes | Out-Null
            $capture = if ($variant -eq 'baseline') { 'baseline' } else { 'current' }
            javac --release 21 --source-path "$sources/java" -d $classes ci/speech-focus/FocusFixture.java "ci/speech-focus/$capture/FixtureCapture.java"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            java -cp "$classes;$sources/resources;build/generated/offline-speech" dev.mobsear.client.FocusFixture $fixtureRoot $variant
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          python ci/speech-focus/compare.py $fixtureRoot
  integrated:
    name: Single-player world and local connection on NeoForge 21.1.249
    needs: windows-speech
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recognized-calls
          path: build/cue-proof
      - name: Exercise calls through the single-player connection
        env:
          MOBSEAR_INTEGRATED: '1'
          MOBSEAR_CUE_PROOF: ${{ github.workspace }}/build/cue-proof/recognized-calls.txt
        run: xvfb-run -a -s '-screen 0 1024x768x24' bash ci/integrated/run.sh
      - name: Keep actual mob-call notices beside the health and armor bars
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notice-previews
          path: build/notice-previews/*.png
          if-no-files-found: warn
  multiplayer:
    if: github.ref_name != 'codex/berry-visit-source' || github.event_name == 'workflow_dispatch'
    name: Two NeoForge 21.1.249 clients on a disposable server
    needs: windows-speech
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recognized-calls
          path: build/cue-proof
      - name: Send generated audio across real game connections
        env:
          MOBSEAR_STATE_CAPTURE: '1'
          MOBSEAR_CUE_PROOF: ${{ github.workspace }}/build/cue-proof/recognized-calls.txt
        run: xvfb-run -a -s '-screen 0 1024x768x24' bash ci/multiplayer/run.sh
      - name: Keep in-game microphone state captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: state-previews
          path: build/state-previews/*.png
          if-no-files-found: error
      - name: Keep synthetic receiving-client audio
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pitch-previews
          path: build/pitch-previews/*.wav
          if-no-files-found: error
