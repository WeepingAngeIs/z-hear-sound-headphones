name: Prototype checks
on:
  push:
    branches: [codex/proximity-voice-prototype, codex/berry-visit-source, codex/berry-chew-pro-build, codex/no-mob-call-cooldowns, main]
    paths-ignore: ['ci/windows-world/**', '.github/workflows/windows-world.yml', 'ci/fullpack/**', '.github/workflows/fullpack.yml', 'ci/cobblemon/java/**', 'ci/cobblemon/run.py', '.github/workflows/cobblemon-worlds.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: prototype-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  game:
    name: Build and dedicated GameTests on NeoForge 21.1.249
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and check synthetic audio, segmentation and rate limits
        run: |
          bash gradlew --no-daemon build
          mkdir -p dist
          cp build/libs/mobsear-0.3.14.jar dist/
          sha256sum dist/mobsear-0.3.14.jar
          jar tf dist/mobsear-0.3.14.jar > "$RUNNER_TEMP/mod-contents.txt"
          python3 ci/audit_archive.py dist/*.jar --version 0.3.14
          if grep -E 'GameTest|Fixture|hearing_floor' "$RUNNER_TEMP/mod-contents.txt"; then exit 1; fi
      - name: Exercise the server in a disposable world
        shell: bash
        run: |
          set -o pipefail
          bash gradlew --no-daemon -PvoiceGameTests runGameTestServer 2>&1 | tee "$RUNNER_TEMP/gametest.log"
          grep -Ei 'all [1-9][0-9]* required tests passed' "$RUNNER_TEMP/gametest.log"
      - name: Keep the verified mod jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobs-hear-u
          path: dist/mobsear-0.3.14.jar
          if-no-files-found: error
      - name: Prepare named test JAR
        if: github.ref_name == 'codex/no-mob-call-cooldowns'
        run: |
          mkdir -p release-name
          cp dist/mobsear-0.3.14.jar 'release-name/Mic Voice Chat - Mobs & Cobblemon Hear You.jar'
          (cd release-name && sha256sum *.jar > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Attach named test JAR and checksum
        if: github.ref_name == 'codex/no-mob-call-cooldowns'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobs-hear-u-no-mob-call-cooldowns
          path: release-name/
          if-no-files-found: error

  packaged-server:
    name: Packaged jar on NeoForge ${{ matrix.loader }}
    needs: game
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        loader: ['21.1.249', '21.1.255']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mobs-hear-u
          path: dist
      - name: Restore the original public Guardian fixture for the pack target
        if: matrix.loader == '21.1.249'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/cobblemon/stage.py --guardian-input
      - name: Boot and stop the exact production jar in an isolated server
        run: python3 ci/packaged_server.py ${{ matrix.loader }} dist/*.jar
  windows-speech:
    needs: game
    name: Offline Windows speech from synthetic PCM
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mobs-hear-u
          path: dist
      - name: Prepare exact packaged speech dependencies and generated fixture corpus
        shell: powershell
        run: ./ci/portable_speech_checks.ps1 prepare
      - name: Exercise packaged Windows recognition from generated input
        shell: powershell
        env:
          MOBSEAR_SYNTH_PROOF_DIR: build/synthetic-speech
          MOBSEAR_CUE_PROOF: recognized-calls.txt
          MOBSEAR_SPECIES_PROOF: recognized-species.txt
        run: ./ci/portable_speech_checks.ps1 commands
      - name: Check rejection feedback, bounded timeouts and recovery
        shell: powershell
        run: ./ci/portable_speech_checks.ps1 lifecycle
      - name: Keep the stock synthetic speech pitch demo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spoken-pitch-proof
          path: build/synthetic-speech/*.wav
          if-no-files-found: error
      - name: Pass only the synthetic cue decisions to the game clients
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recognized-calls
          path: |
            recognized-calls.txt
            recognized-distractions.txt
            recognized-species.txt
            build/speech-species.tsv
          if-no-files-found: error
  sentence-speech:
    needs: game
    name: Whole names in connected speech on Windows
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mobs-hear-u
          path: dist
      - name: Prepare exact packaged speech dependencies and generated fixture corpus
        shell: powershell
        run: ./ci/portable_speech_checks.ps1 prepare
      - name: Whole names and nearby alternatives from generated speech
        shell: powershell
        run: |
          ./ci/portable_speech_checks.ps1 sentences
          ./ci/portable_speech_checks.ps1 nearby
  focused-speech:
    name: Spoken pronunciation and false-positive comparisons
    needs: windows-speech
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recognized-calls
          path: comparison-inputs
      - name: Fetch the verified 0.3.0 speech implementation for an identical-input comparison
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: c1e3a51d3c41f4e0d9a7c82cfc71ad5bb7c9fe10
          path: speech-baseline
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mobs-hear-u
          path: dist
      - name: Prepare exact packaged speech dependencies and generated fixture corpus
        shell: powershell
        run: ./ci/portable_speech_checks.ps1 prepare
      - name: Compare spoken Enderman and Lopunny on identical generated input
        shell: powershell
        run: ./ci/portable_speech_checks.ps1 focused
  integrated:
    name: Single-player world and local connection on NeoForge 21.1.249
    needs: windows-speech
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recognized-calls
          path: build/cue-proof
      - name: Exercise calls through the single-player connection
        env:
          MOBSEAR_INTEGRATED: '1'
          MOBSEAR_CUE_PROOF: ${{ github.workspace }}/build/cue-proof/recognized-calls.txt
        run: xvfb-run -a -s '-screen 0 1024x768x24' bash ci/integrated/run.sh
      - name: Keep actual mob-call notices beside the health and armor bars
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notice-previews
          path: build/notice-previews/*.png
          if-no-files-found: warn
  multiplayer:
    if: github.ref_name != 'codex/berry-visit-source' || github.event_name == 'workflow_dispatch'
    name: Two NeoForge 21.1.249 clients on a disposable server
    needs: windows-speech
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recognized-calls
          path: build/cue-proof
      - name: Send generated audio across real game connections
        env:
          MOBSEAR_STATE_CAPTURE: '1'
          MOBSEAR_CUE_PROOF: ${{ github.workspace }}/build/cue-proof/recognized-calls.txt
        run: xvfb-run -a -s '-screen 0 1024x768x24' bash ci/multiplayer/run.sh
      - name: Keep in-game microphone state captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: state-previews
          path: build/state-previews/*.png
          if-no-files-found: error
      - name: Keep synthetic receiving-client audio
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pitch-previews
          path: build/pitch-previews/*.wav
          if-no-files-found: error
