name: Legacy Windows model compatibility
description: Evaluate the two exact distribution archives with a pinned legacy Microsoft runtime
inputs:
  token:
    description: Read-only Actions artifact access
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.7.9'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: voice-archive-verification
        run-id: '45500399343'
        github-token: ${{ inputs.token }}
        path: prior
    - shell: pwsh
      run: |
        python -m pip install numpy==1.21.6 protobuf==3.20.3
        if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
        python ci/speech-focus/legacy_model.py
